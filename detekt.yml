config:
  validation: true

complexity:
  ComplexCondition:
    allowedConditions: 4
  CyclomaticComplexMethod:
    allowedComplexity: 15
  LargeClass:
    allowedLines: 600
  LongMethod:
    allowedLines: 60
  LongParameterList:
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 5

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3
    excludedFunctions:
      - 'equals'
    excludeReturnFromLambda: true
